_BASE_: Base-COCO-InstanceSegmentation.yaml
MODEL:
  META_ARCHITECTURE: "QAGNet"
  BACKBONE:
    NAME: "build_resnet_backbone"
  WEIGHTS: "<PATH_TO_PRETRAINED_BACKBONE>"
  RESNETS:
    DEPTH: 50
    STEM_TYPE: "basic"
    STEM_OUT_CHANNELS: 64
    STRIDE_IN_1X1: False
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
    RES5_MULTI_GRID: [1, 1, 1]
  MASK_FORMER:
    NUM_OBJECT_QUERIES: <PUT_YOUR_NUM_QUERIES>
    HIDDEN_DIM: 256
    NHEADS: 8
    DIM_FEEDFORWARD: 2048
    DEC_LAYERS: <PUT_YOUR_DEC_LAYERS>
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: <PUT_YOUR_CLS_WEIGHT>
    MASK_WEIGHT: <PUT_YOUR_MASK_WEIGHT>
    DICE_WEIGHT: <PUT_YOUR_DICE_WEIGHT>
SOLVER:
  IMS_PER_BATCH: <PUT_YOUR_BATCH_SIZE>
  BASE_LR: <PUT_YOUR_LR>
  STEPS: (<PUT_YOUR_STEP1>, <PUT_YOUR_STEP2>)
  MAX_ITER: <PUT_YOUR_MAX_ITER>
  WARMUP_FACTOR: <PUT_YOUR_WARMUP_FACTOR>
  WARMUP_ITERS: <PUT_YOUR_WARMUP_ITERS>
  WEIGHT_DECAY: <PUT_YOUR_WEIGHT_DECAY>
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: <PUT_YOUR_BACKBONE_MULTIPLIER>
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: <PUT_YOUR_CLIP_VALUE>
    NORM_TYPE: 2.0
INPUT:
  IMAGE_SIZE: <PUT_YOUR_IMAGE_SIZE>
  MIN_SCALE: <PUT_YOUR_MIN_SCALE>
  MAX_SCALE: <PUT_YOUR_MAX_SCALE>
  FORMAT: "RGB"
  DATASET_MAPPER_NAME: "irsr_sor"
DATASETS:
  TRAIN: ("irsr_train",)
  TEST: ("irsr_test",)
TEST:
  EVAL_PERIOD: 0
DATALOADER:
  NUM_WORKERS: 4
VERSION: 2
